# Saywell release version (Semantic Versioning: MAJOR.MINOR.PATCH).
#
# The Android versionCode (build number) is derived from it:
#   versionCode = MAJOR * 10000 + MINOR * 100 + PATCH   (0.1.0 -> 100, 1.2.3 -> 10203)
# so every release has a higher build number than the one before.
#
# To release, bump this value, add a CHANGELOG.md section, and push the tag v<version>.
# See docs/releasing.md.
version=0.1.0
